# ─────────────────────────────────────────────────────────────────────────────
#  iNubVision Academy (ASP.NET Core 8) — CI/CD
#
#  Runs on YOUR Windows self-hosted runner. Deploys to a SEPARATE Azure Windows VM:
#
#   self-hosted runner                         Azure                         target VM (IIS)
#   ──────────────────                         ─────                         ───────────────
#   build + publish + zip
#   security scan (Trivy)
#   az login (OIDC) ──► upload zip ──► Blob Storage (private, 2-hour read link)
#                   ──► Azure Run Command ─────────────────────────────────► remote-deploy.ps1:
#                                                                            enable IIS + .NET 8 (if missing)
#                                                                            settings → backup → deploy
#                                                                            health check → rollback on failure
#
#  No ports opened on the VM, no VM password in GitHub, nothing installed on the VM except IIS + .NET.
#
#  Runner requirements: Windows, labels  self-hosted + windows, Azure CLI installed (az), internet access.
#  One-time Azure + GitHub setup: deploy/azure/setup-cicd.ps1 (prints every secret/variable to add).
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD (Azure Windows VM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-vm
  cancel-in-progress: false      # never cancel a deployment half-way

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TRIVY_VERSION: '0.74.0'
  SITE_NAME: AcademyNet
  SITE_PATH: C:\inetpub\AcademyNet

jobs:
  build:
    name: Build & publish
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AcademyNet.csproj

      - name: Build
        run: dotnet build AcademyNet.csproj -c Release --no-restore

      - name: Publish and zip
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path publish) { Remove-Item publish -Recurse -Force }
          if (Test-Path package) { Remove-Item package -Recurse -Force }
          dotnet publish AcademyNet.csproj -c Release --no-build -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          New-Item -ItemType Directory package | Out-Null
          Compress-Archive -Path publish\* -DestinationPath package\academy.zip
          Write-Host ("Package: {0:N1} MB" -f ((Get-Item package\academy.zip).Length / 1MB))

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: academy-package
          path: package/academy.zip
          retention-days: 14

  security:
    name: Security scan (Trivy)
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (dependencies, config, secrets)
        continue-on-error: true      # a scanner download problem never blocks a release
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE "trivy\$env:TRIVY_VERSION"
          $exe = Join-Path $dir 'trivy.exe'
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $url = "https://github.com/aquasecurity/trivy/releases/download/v$env:TRIVY_VERSION/trivy_$($env:TRIVY_VERSION)_windows-64bit.zip"
            Invoke-WebRequest -Uri $url -OutFile "$dir\trivy.zip" -UseBasicParsing
            Expand-Archive "$dir\trivy.zip" -DestinationPath $dir -Force
          }
          # report only: change --exit-code 0 to 1 to block deployments on findings
          & $exe fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 .

  deploy:
    name: Deploy to Azure Windows VM
    needs: [build, security]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment:
      name: production-vm
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write            # OIDC login to Azure
    defaults:
      run:
        shell: powershell
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM: ${{ vars.AZURE_VM_NAME }}
      STORAGE: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      CONTAINER: deployments
      BLOB: academy-${{ github.run_id }}-${{ github.run_attempt }}.zip
      RUN_NAME: deploy-academy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Get deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/azure

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: academy-package
          path: package

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload package to Blob Storage
        run: |
          $ErrorActionPreference = 'Stop'
          az storage blob upload --auth-mode login --account-name $env:STORAGE -c $env:CONTAINER -n $env:BLOB -f package\academy.zip --overwrite --only-show-errors -o none
          if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
          $expiry = (Get-Date).ToUniversalTime().AddHours(2).ToString('yyyy-MM-ddTHH:mmZ')
          $sas = az storage blob generate-sas --auth-mode login --as-user --account-name $env:STORAGE -c $env:CONTAINER -n $env:BLOB --permissions r --expiry $expiry --https-only --full-uri -o tsv
          if ($LASTEXITCODE -ne 0 -or -not $sas) { throw "Could not create the download link" }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($sas.Trim()))
          Write-Host "::add-mask::$b64"
          "PACKAGE_B64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Uploaded $env:BLOB (read link valid 2 hours)"

      - name: Deploy on the VM (Azure Run Command)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SQL_CONNECTION: ${{ secrets.SQL_CONNECTION }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Site settings from environment secrets (skipped when ADMIN_EMAIL is empty → the VM keeps its current file)
          $settingsB64 = ''
          if ($env:ADMIN_EMAIL) {
            $s = [ordered]@{
              Admin    = [ordered]@{ Email = $env:ADMIN_EMAIL; Password = $env:ADMIN_PASSWORD }
              Razorpay = [ordered]@{ KeyId = $env:RAZORPAY_KEY_ID; KeySecret = $env:RAZORPAY_KEY_SECRET; WebhookSecret = $env:RAZORPAY_WEBHOOK_SECRET }
            }
            if ($env:SQL_CONNECTION) { $s.Database = @{ Provider = 'SqlServer' }; $s.ConnectionStrings = @{ Default = $env:SQL_CONNECTION } }
            $settingsB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($s | ConvertTo-Json -Depth 5)))
            Write-Host "::add-mask::$settingsB64"
          }

          # Everything is base64, so no characters get mangled by az.cmd on Windows.
          # Secrets go in --protected-parameters (encrypted, never shown in the VM's run-command history).
          $azArgs = @(
            'vm','run-command','create',
            '-g', $env:RG, '--vm-name', $env:VM, '--name', $env:RUN_NAME,
            '--script', '@deploy\azure\remote-deploy.ps1',
            '--parameters', "SiteName=$env:SITE_NAME", "SitePath=$env:SITE_PATH",
            '--protected-parameters', "PackageB64=$env:PACKAGE_B64"
          )
          if ($settingsB64) { $azArgs += "SettingsB64=$settingsB64" }
          $azArgs += @('--timeout-in-seconds', '3600', '--async-execution', 'false', '--only-show-errors', '-o', 'none')

          Write-Host "Running remote-deploy.ps1 on $env:VM (enable IIS → deploy → health check) ..."
          & az @azArgs
          $createExit = $LASTEXITCODE

          $view = az vm run-command show -g $env:RG --vm-name $env:VM --name $env:RUN_NAME --instance-view `
                    --query "instanceView.{state:executionState, exitCode:exitCode, output:output, error:error}" -o json | ConvertFrom-Json
          Write-Host "──────── output from the VM ────────"
          Write-Host $view.output
          if ($view.error) { Write-Host "──────── errors ────────"; Write-Host $view.error }
          Write-Host "State: $($view.state), exit code: $($view.exitCode)"

          if ($createExit -ne 0 -or $view.state -ne 'Succeeded' -or $view.exitCode -ne 0) {
            throw "Deployment failed on the VM (see output above). If the health check failed, the previous version was restored."
          }

      - name: Check the site from outside
        if: ${{ vars.SITE_URL != '' }}
        run: |
          $url = "${{ vars.SITE_URL }}".TrimEnd('/') + '/health'
          for ($i = 1; $i -le 12; $i++) {
            try { $r = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 10; if ($r.Content -match 'UP') { Write-Host "Public check OK: $url"; exit 0 } } catch { }
            Start-Sleep -Seconds 5
          }
          Write-Warning "Could not reach $url from the runner (check DNS / NSG ports 80-443). The VM-side health check already passed."
          exit 0

      - name: Clean up
        if: always()
        run: |
          az vm run-command delete -g $env:RG --vm-name $env:VM --name $env:RUN_NAME --yes --only-show-errors 2>$null
          az storage blob delete --auth-mode login --account-name $env:STORAGE -c $env:CONTAINER -n $env:BLOB --only-show-errors 2>$null
          exit 0
